<header class="bg-white shadow px-6 py-3 flex justify-between items-center fixed top-0 left-0 right-0 z-50">
  <!-- Logo / Título -->
  <div class="flex items-center space-x-2">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-bold-100" fill="none"
         viewBox="0 0 24 24" stroke="currentColor">
      <!-- Ícone de casa (semântico para sistema imobiliário) -->
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 9.75V21h18V9.75L12 3 3 9.75z" />
    </svg>
    <h1 class="text-lg font-bold">Sistema Imobiliário</h1>
  </div>

  <!-- Área de ações -->
  <div class="flex items-center space-x-6">
    <!-- Campo de busca -->
    <div class="relative">
      <input type="text" placeholder="Buscar..."
             class="border rounded-md pl-8 pr-3 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      <svg xmlns="http://www.w3.org/2000/svg"
           class="h-4 w-4 absolute left-2 top-1.5 text-gray-400"
           fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-4.35-4.35M10 18a8 8 0 100-16 8 8 0 000 16z"/>
      </svg>
    </div>

    <!-- Notificações -->
    <div class="relative">
      <svg xmlns="http://www.w3.org/2000/svg"
           class="h-6 w-6 text--600 cursor-pointer"
           fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 10-12 0v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
      </svg>
      <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full px-1">3</span>
    </div>

    <!-- Perfil do usuário -->
    <div class="flex items-center space-x-2">
      <img src="https://via.placeholder.com/32" alt="João Silva"
           class="w-8 h-8 rounded-full border"/>
      <div class="text-sm">
        <p class="font-medium text-gray-800">João Silva</p>
        <p class="text-gray-500">Administrador</p>
      </div>
    </div>
  </div>
</header>
