<div class="bg-white shadow rounded-lg p-6 mb-6">
  <h2 class="text-2xl font-bold text-gray-800 mb-4">Cadastro de Usuário</h2>
  <form class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700">Nome</label>
      <input type="text" class="mt-1 block w-full border rounded-md px-3 py-2"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">E-mail</label>
      <input type="email" class="mt-1 block w-full border rounded-md px-3 py-2"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">Perfil</label>
      <select class="mt-1 block w-full border rounded-md px-3 py-2">
        <option>Administrador</option>
        <option>Imóvel</option>
        <option>Financeiro</option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">Conta</label>
      <textarea class="mt-1 block w-full border rounded-md px-3 py-2"></textarea>
    </div>
    <div class="flex justify-end space-x-4">
      <button class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-300">Cancelar</button>
      <button class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">Salvar Usuário</button>
    </div>
  </form>
</div>
