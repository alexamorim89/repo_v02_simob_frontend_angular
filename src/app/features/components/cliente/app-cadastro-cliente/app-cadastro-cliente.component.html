<div class="min-h-screen bg-gray-50 p-6">
  <div class="max-w-full mx-auto bg-white shadow rounded-lg p-6">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Cadastro de Cliente</h2>

    <!-- Tipo de cliente -->
    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-2">Tipo de Cliente</label>
      <select class="w-full border rounded-md px-3 py-2 focus:ring-blue-500 focus:border-blue-500">
        <option>Pessoa Física</option>
        <option>Pessoa Jurídica</option>
      </select>
    </div>

    <!-- Pessoa Física -->
    <div class="space-y-4 mb-8">
      <h3 class="text-lg font-semibold text-gray-700">Pessoa Física</h3>
      <div>
        <label class="block text-sm font-medium text-gray-700">Nome Completo</label>
        <input type="text" class="mt-1 block w-full border rounded-md px-3 py-2"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">CPF</label>
        <input type="text" class="mt-1 block w-full border rounded-md px-3 py-2"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">RG</label>
        <input type="text" class="mt-1 block w-full border rounded-md px-3 py-2"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Data de Nascimento</label>
        <input type="date" class="mt-1 block w-full border rounded-md px-3 py-2"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Telefone</label>
        <input type="tel" class="mt-1 block w-full border rounded-md px-3 py-2"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">E-mail</label>
        <input type="email" class="mt-1 block w-full border rounded-md px-3 py-2"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Endereço</label>
        <textarea class="mt-1 block w-full border rounded-md px-3 py-2"></textarea>
      </div>
    </div>

    <!-- Pessoa Jurídica -->
    <div class="space-y-4 mb-8">
      <h3 class="text-lg font-semibold text-gray-700">Pessoa Jurídica</h3>
      <div>
        <label class="block text-sm font-medium text-gray-700">Razão Social</label>
        <input type="text" class="mt-1 block w-full border rounded-md px-3 py-2"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Nome Fantasia</label>
        <input type="text" class="mt-1 block w-full border rounded-md px-3 py-2"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">CNPJ</label>
        <input type="text" class="mt-1 block w-full border rounded-md px-3 py-2"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Inscrição Estadual</label>
        <input type="text" class="mt-1 block w-full border rounded-md px-3 py-2"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Telefone Comercial</label>
        <input type="tel" class="mt-1 block w-full border rounded-md px-3 py-2"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">E-mail Corporativo</label>
        <input type="email" class="mt-1 block w-full border rounded-md px-3 py-2"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Endereço da Empresa</label>
        <textarea class="mt-1 block w-full border rounded-md px-3 py-2"></textarea>
      </div>
    </div>

    <!-- Botões -->
    <div class="flex justify-end space-x-4">
      <button class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-300 transition">
        Consultar
      </button>
      <button class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">
        Salvar Informações
      </button>
    </div>
  </div>
</div>
