<div class="min-h-screen bg-gray-50 p-6">
  <!-- Cabeçalho -->
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Consulta de Cliente</h2>
    <a routerLink="/clientes/novo"
       class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition">
      + Novo Cliente
    </a>
  </div>

  <!-- Filtros -->
  <div class="bg-white shadow rounded-lg p-4 mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
    <input type="text" placeholder="Buscar cliente interessado"
           class="border rounded-md px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500"/>

    <select class="border rounded-md px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500">
      <option>Disponibilidade</option>
      <option>Disponível</option>
      <option>Indisponível</option>
    </select>

    <button class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">
      Filtrar
    </button>
  </div>

  <!-- Lista de clientes -->
  <div class="bg-white shadow rounded-lg overflow-hidden">
    <table class="min-w-full text-sm">
      <thead class="bg-gray-100">
        <tr>
          <th class="px-4 py-2 text-left font-medium text-gray-700">Foto</th>
          <th class="px-4 py-2 text-left font-medium text-gray-700">Título/Tipo</th>
          <th class="px-4 py-2 text-left font-medium text-gray-700">Descrição</th>
          <th class="px-4 py-2 text-left font-medium text-gray-700">Status</th>
          <th class="px-4 py-2 text-left font-medium text-gray-700">Departamento</th>
          <th class="px-4 py-2 text-left font-medium text-gray-700">Preço</th>
          <th class="px-4 py-2 text-left font-medium text-gray-700">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr class="border-t">
          <td class="px-4 py-2">
            <img src="https://via.placeholder.com/80" alt="Cliente" class="rounded-md"/>
          </td>
          <td class="px-4 py-2">Cita para cliente</td>
          <td class="px-4 py-2">Gran Grand Emms</td>
          <td class="px-4 py-2">
            <span class="px-2 py-1 rounded-full text-xs bg-green-100 text-green-700">Disponível</span>
          </td>
          <td class="px-4 py-2">Departamento</td>
          <td class="px-4 py-2">345,50 €</td>
          <td class="px-4 py-2">
            <button class="text-blue-600 hover:underline">Ver mais</button>
          </td>
        </tr>
        <tr class="border-t">
          <td class="px-4 py-2">
            <img src="https://via.placeholder.com/80" alt="Cliente" class="rounded-md"/>
          </td>
          <td class="px-4 py-2">Cita para cliente</td>
          <td class="px-4 py-2">Gran Grand Emms</td>
          <td class="px-4 py-2">
            <span class="px-2 py-1 rounded-full text-xs bg-green-100 text-green-700">Disponível</span>
          </td>
          <td class="px-4 py-2">Departamento</td>
          <td class="px-4 py-2">745,50 €</td>
          <td class="px-4 py-2">
            <button class="text-blue-600 hover:underline">Ver mais</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Paginação -->
  <div class="flex justify-center items-center space-x-2 mt-4">
    <button class="px-3 py-1 border rounded hover:bg-gray-100">1</button>
    <button class="px-3 py-1 border rounded hover:bg-gray-100">2</button>
    <button class="px-3 py-1 border rounded hover:bg-gray-100">3</button>
    <span class="px-3 py-1">...</span>
    <button class="px-3 py-1 border rounded hover:bg-gray-100">5</button>
    <button class="px-3 py-1 border rounded hover:bg-gray-100">Próximo</button>
  </div>
</div>
