<div class="min-h-screen bg-gray-50 p-6">
  <!-- Cabeçalho -->
   <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Consulta de Agendamento</h2>
    <!-- Botão de navegação -->
    <a routerLink="/agendamentos/novo"
       class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">
      + Novo Agendamento
    </a>
  </div>

  <!-- Filtros -->
  <div class="bg-white shadow rounded-lg p-4 mb-6 grid grid-cols-1 md:grid-cols-4 gap-4">
    <input type="text" placeholder="Buscar paciente"
           class="border rounded-md px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500"/>

    <select class="border rounded-md px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500">
      <option>Local</option>
      <option>Centro Saúde Familiar</option>
      <option>Centro Especialidades</option>
    </select>

    <input type="date"
           class="border rounded-md px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500"/>

    <button class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">
      Buscar
    </button>
  </div>

  <!-- Tabela de agendamentos -->
  <div class="bg-white shadow rounded-lg overflow-hidden">
    <table class="min-w-full text-sm">
      <thead class="bg-gray-100">
        <tr>
          <th class="px-4 py-2 text-left font-medium text-gray-700">Nome</th>
          <th class="px-4 py-2 text-left font-medium text-gray-700">Local</th>
          <th class="px-4 py-2 text-left font-medium text-gray-700">Data e Hora</th>
          <th class="px-4 py-2 text-left font-medium text-gray-700">Estado</th>
          <th class="px-4 py-2 text-left font-medium text-gray-700">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr class="border-t">
          <td class="px-4 py-2">Maria Silva</td>
          <td class="px-4 py-2">Centro Especialidades</td>
          <td class="px-4 py-2">10/06 - 11:30</td>
          <td class="px-4 py-2">
            <span class="px-2 py-1 rounded-full text-xs bg-yellow-100 text-yellow-700">Em espera</span>
          </td>
          <td class="px-4 py-2">
            <button class="text-blue-600 hover:underline">Detalhes</button>
          </td>
        </tr>
        <tr class="border-t">
          <td class="px-4 py-2">Joana Melo</td>
          <td class="px-4 py-2">Centro Saúde Familiar</td>
          <td class="px-4 py-2">11/06 - 14:00</td>
          <td class="px-4 py-2">
            <span class="px-2 py-1 rounded-full text-xs bg-green-100 text-green-700">Em consulta</span>
          </td>
          <td class="px-4 py-2">
            <button class="text-blue-600 hover:underline">Detalhes</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
